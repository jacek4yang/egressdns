# cargo-deny configuration.
#
# Run with: cargo deny check

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
version = 2
yanked = "deny"
# paste (RUSTSEC-2024-0436) is unmaintained but not vulnerable, is a build-time
# proc-macro rather than runtime code, and reaches the graph transitively via
# netdev's netlink stack — not ours to replace. Re-visit if it ever gains a
# vulnerability or a maintainer.
ignore = ["RUSTSEC-2024-0436"]

[licenses]
version = 2
# Permissive licences only. Anything copyleft would change the licensing of the binary and
# must be a deliberate decision, not an accident of a transitive dependency.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# The list above is exactly the set the current dependency graph uses. Keeping it exact
# rather than generous means adding a dependency under a new licence is a decision somebody
# makes on purpose, in a diff, rather than something that slips through. MPL-2.0 and
# BSL-1.0 were removed when nothing needed them; re-add with a note if that changes.

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
# Nothing in this project may pull in an alternative TLS stack: exactly one TLS
# implementation keeps the security surface reviewable.
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
